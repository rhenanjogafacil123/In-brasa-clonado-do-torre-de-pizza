name: Optimize menu images once

on:
  push:
    paths:
      - ".github/workflows/optimize-menu-images-once.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert menu PNGs to optimized WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          menu = Path('public/menu')
          converted = 0
          for src in sorted(menu.glob('*.png')):
              dst = src.with_suffix('.webp')
              with Image.open(src) as im:
                  im.thumbnail((720, 720), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  im.save(dst, 'WEBP', quality=80, method=6)
              converted += 1
              print(f'{src} -> {dst}')
          print(f'Converted {converted} PNG files')
          PY

      - name: Point product images directly to local WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/product-image.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('.png"', '.webp"')
          text = re.sub(
              r'\nconst PUBLIC_SITE_ORIGIN = .*?\n\nfunction optimizedMenuImage\(path: string\) \{.*?\n\}\n',
              '\n',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'export function productImage\(product: Pick<Product, "id" \| "image">\) \{\n  const image = productImages\[product\.id\] \?\? product\.image;\n  return image\.startsWith\("/menu/"\) \? optimizedMenuImage\(image\) : image;\n\}',
              'export function productImage(product: Pick<Product, "id" | "image">) {\n  return productImages[product.id] ?? product.image;\n}',
              text,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit optimized assets and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/menu src/lib/product-image.ts
          git rm .github/workflows/optimize-menu-images-once.yml
          git commit -m "perf: serve optimized local WebP menu images"
          git push
