name: Optimize portion images

on:
  push:
    paths:
      - '.github/workflows/optimize-portions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert portion images to WebP
        run: |
          cwebp -quiet -q 80 -resize 720 720 "public/menu/ChatGPT Image 30 de ago. de 2026, 21_32_48 (1).png" -o "public/menu/porcao-batata-bacon-cheddar.webp"
          cwebp -quiet -q 80 -resize 720 720 "public/menu/ChatGPT Image 30 de ago. de 2026, 21_32_49 (2).png" -o "public/menu/porcao-batata-frango.webp"
          cwebp -quiet -q 80 -resize 720 720 "public/menu/ChatGPT Image 30 de ago. de 2026, 21_32_49 (3).png" -o "public/menu/porcao-batata-barquinho.webp"
          cwebp -quiet -q 80 -resize 720 720 "public/menu/ChatGPT Image 30 de ago. de 2026, 21_32_49 (4).png" -o "public/menu/porcao-nuggets-20.webp"
          cwebp -quiet -q 80 -resize 720 720 "public/menu/ChatGPT Image 30 de ago. de 2026, 21_32_49 (5).png" -o "public/menu/porcao-aneis-cebola-20.webp"
          cwebp -quiet -q 80 -resize 720 720 "public/menu/ChatGPT Image 30 de ago. de 2026, 21_32_50 (6).png" -o "public/menu/porcao-fritas.webp"

      - name: Link WebP images to portion products
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/product-image.ts')
          text = p.read_text()
          if '"batata-bacon-cheddar"' not in text:
              needle = '  "acai": "/menu/acai.webp",\n};'
              replacement = '''  "acai": "/menu/acai.webp",
  "batata-bacon-cheddar": "/menu/porcao-batata-bacon-cheddar.webp",
  "batata-frango": "/menu/porcao-batata-frango.webp",
  "batata-barquinho": "/menu/porcao-batata-barquinho.webp",
  "nuggets-20": "/menu/porcao-nuggets-20.webp",
  "aneis-cebola-20": "/menu/porcao-aneis-cebola-20.webp",
  "porcao-fritas": "/menu/porcao-fritas.webp",
};'''
              if needle not in text:
                  raise SystemExit('Expected insertion point not found in product-image.ts')
              p.write_text(text.replace(needle, replacement))
          PY

      - name: Commit optimized portion images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/menu/*.webp src/lib/product-image.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf: add optimized portion images"
          git push
