name: Check Vercel Public Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production URL
        run: |
          set -e
          URL="https://in-brasa-clonado-do-torre-de-pizza-rhenanzinho09-4700.vercel.app"
          echo "Checking $URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "--- First 1000 bytes ---"
              head -c 1000 /tmp/page.html
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not return HTTP 200"
          cat /tmp/page.html 2>/dev/null | head -c 2000 || true
          exit 1
