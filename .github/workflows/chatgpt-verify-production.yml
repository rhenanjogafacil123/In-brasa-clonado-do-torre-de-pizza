name: ChatGPT Verify Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check production URLs
        shell: bash
        run: |
          for URL in \
            'https://hello-friend-rhenanzinho09-4700.vercel.app' \
            'https://hello-friend-gywu3cqu4-rhenanzinho09-4700.vercel.app'; do
            echo "===== $URL ====="
            curl -L -sS -D /tmp/headers.txt -o /tmp/page.html -w 'HTTP %{http_code}\nFINAL %{url_effective}\n' "$URL" || true
            echo '--- headers ---'
            head -40 /tmp/headers.txt || true
            echo '--- body ---'
            head -c 2500 /tmp/page.html || true
            echo
          done
