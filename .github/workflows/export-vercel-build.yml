name: Export Vercel Build
on:
  push:
    paths:
      - '.github/workflows/export-vercel-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Point media to existing public CDN
        run: |
          python - <<'PY'
          from pathlib import Path
          base='https://torre-pizza-digital.lovable.app'
          for p in Path('src').rglob('*'):
              if p.is_file() and p.suffix in {'.ts','.tsx','.css'}:
                  s=p.read_text(encoding='utf-8')
                  for prefix in ['/menu/','/hero-pizza.webp','/about-pizzeria.webp','/logo.webp','/logo.svg','/logo-exact.svg','/favicon.ico']:
                      s=s.replace('"'+prefix, '"'+base+prefix).replace("'"+prefix, "'"+base+prefix)
                  p.write_text(s,encoding='utf-8')
          PY
          rm -rf public/menu public/*.webp public/*.ico public/*.svg
      - run: bun install --frozen-lockfile
      - name: Build for Vercel
        env:
          NITRO_PRESET: vercel
        run: bun run build
      - name: Collect output
        run: |
          mkdir -p deploybundle
          if [ -d .vercel/output ]; then
            cp -R .vercel deploybundle/.vercel
            echo vercel-output > deploybundle/FORMAT
          elif [ -d .output ]; then
            cp -R .output deploybundle/.output
            echo nitro-output > deploybundle/FORMAT
          else
            echo 'No known build output found' >&2
            find . -maxdepth 2 -type d | sort
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hello-friend-vercel-build
          path: deploybundle
          include-hidden-files: true
