name: One-time dependency security autofix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_secret
      SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_secret
      VITE_SUPABASE_URL: https://example.invalid
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pinned v2
      - name: Apply compatible dependency security fixes
        run: bun audit fix
      - name: Confirm no high or critical dependency vulnerabilities remain
        run: bun audit --audit-level=high
      - name: Confirm production build still succeeds
        run: bun run build
      - name: Restrict changes to dependency manifests
        id: changes
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(package\.json|bun\.lock)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- package.json bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit verified dependency fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'security: update vulnerable transitive dependencies'
      - name: Push verified dependency fixes
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
