name: Preserve Sub Torre customization

on:
  push:
    paths:
      - '.github/workflows/preserve-subtorre-options.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Keep remove-ingredients option for Sub Torre
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/data/menu.ts')
          text = p.read_text()
          text = text.replace(
              '// "Retirar ingredientes" (opcional) para pizzas, hambúrgueres e combos.',
              '// "Retirar ingredientes" (opcional) para pizzas, hambúrgueres, Sub Torre e combos.'
          )
          text = text.replace(
              'new Set<Product["category"]>(["pizzas", "hamburgueres", "combos"])',
              'new Set<Product["category"]>(["pizzas", "hamburgueres", "subtorre", "combos"])'
          )
          p.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/menu.ts
          git commit -m "fix: keep Sub Torre ingredient customization" || exit 0
          git push
