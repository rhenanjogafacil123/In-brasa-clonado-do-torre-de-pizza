name: Check Vercel Public Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production URL
        run: |
          set -e
          URL="https://in-brasa-clonado-do-torre-de-pizza-rhenanzinho09-4700.vercel.app"
          echo "=== Initial response ==="
          curl -sS -D /tmp/headers.txt -o /tmp/initial.html "$URL" || true
          cat /tmp/headers.txt
          echo "=== Follow redirects ==="
          curl -L -sS -o /tmp/page.html -w 'HTTP=%{http_code}\nEFFECTIVE_URL=%{url_effective}\nCONTENT_TYPE=%{content_type}\n' "$URL"
          echo "=== Page markers ==="
          grep -o -E '<title>[^<]*</title>|Torre de Pizza|IN.?BRASA|Vercel|Log In|Sign Up|404|Not Found' /tmp/page.html | head -30 || true
          echo "=== First 2000 bytes ==="
          head -c 2000 /tmp/page.html
          echo
