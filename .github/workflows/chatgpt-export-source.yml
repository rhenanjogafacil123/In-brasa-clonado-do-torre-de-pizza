name: ChatGPT Export Source

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -r hello-friend-source.zip . -x '.git/*' 'node_modules/*' 'hello-friend-source.zip'
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-friend-source
          path: hello-friend-source.zip
          if-no-files-found: error
          retention-days: 1

  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel preview
        shell: bash
        run: |
          URL='https://hello-friend-6pjp1fyip-rhenanzinho09-4700.vercel.app'
          for i in {1..18}; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo 'Preview is online.'
              head -c 1000 /tmp/page.html
              exit 0
            fi
            sleep 5
          done
          echo 'Preview did not become healthy.'
          exit 1
