name: ChatGPT Verify Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel URLs
        shell: bash
        run: |
          for URL in \
            'https://torre-pizza-public-test-rhenanzinho09-4700.vercel.app' \
            'https://hello-friend-rhenanzinho09-4700.vercel.app'; do
            echo "===== $URL ====="
            curl -L -sS -o /tmp/page.html -w 'HTTP %{http_code}\nFINAL %{url_effective}\n' "$URL" || true
            head -c 600 /tmp/page.html || true
            echo
          done
