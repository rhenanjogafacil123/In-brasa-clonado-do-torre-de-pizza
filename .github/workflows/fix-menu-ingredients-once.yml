name: Fix menu ingredients once

on:
  push:
    paths:
      - ".github/workflows/fix-menu-ingredients-once.yml"

permissions:
  contents: write

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Correct descriptions and ingredient parsing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/data/menu.ts")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'Carne, cebola, picles, alface, queijo Cheddar ou mussarela em fatias, tomate, azeitona, pimentão, ketchup, mostarda e maionese Billy Jack.':
              'Carne, cebola, picles, alface, queijo Cheddar ou mussarela em fatias, tomate, azeitona, pimentão, ketchup, mostarda, maionese e Billy Jack.',
              'Frango, cebola, picles, alface, queijo Cheddar ou mussarela em fatias, tomate, azeitona, pimentão, ketchup, mostarda e maionese Billy Jack.':
              'Frango, cebola, picles, alface, queijo Cheddar ou mussarela em fatias, tomate, azeitona, pimentão, ketchup, mostarda, maionese e Billy Jack.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected Sub Torre description not found: {old}")
              text = text.replace(old, new, 1)

          fn_marker = "export function ingredientsFromDescription(description: string): string[] {"
          fn_start = text.find(fn_marker)
          if fn_start < 0:
              raise SystemExit("ingredientsFromDescription function not found")
          fn_end = text.find("\n}\n", fn_start)
          if fn_end < 0:
              raise SystemExit("ingredientsFromDescription function end not found")
          fn_end += 3
          fn = text[fn_start:fn_end]

          parser_needle = "  return tokens\n    .map(tidy)"
          parser_replacement = "  return tokens\n    .flatMap((token) => token.split(/\\s+ou\\s+|\\s*\\/\\s*/i))\n    .map(tidy)"
          if parser_needle not in fn:
              raise SystemExit("Expected return pipeline not found in ingredientsFromDescription")

          fn = fn.replace(parser_needle, parser_replacement, 1)
          text = text[:fn_start] + fn + text[fn_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("src/data/menu.ts").read_text(encoding="utf-8")

          checks = {
              "Sub Torre sauces separated": "mostarda, maionese e Billy Jack",
              "alternative ingredients split": ".flatMap((token) => token.split(/\\s+ou\\s+|\\s*\\/\\s*/i))",
          }
          for label, needle in checks.items():
              if needle not in text:
                  raise SystemExit(f"Failed check: {label}")

          if "maionese Billy Jack" in text:
              raise SystemExit("Combined 'maionese Billy Jack' still exists")
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-menu-ingredients-once.yml
          git add src/data/menu.ts
          git commit -m "fix: separate menu ingredients and removal options"
          git push origin HEAD:main
