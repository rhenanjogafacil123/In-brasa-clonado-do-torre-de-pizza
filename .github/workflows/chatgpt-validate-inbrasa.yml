name: ChatGPT Validate Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed site once
        shell: bash
        run: |
          URL='https://inbrasa.vercel.app'
          echo '=== direct request ==='
          curl -sS --max-time 20 -D /tmp/h1 -o /tmp/b1 -w 'HTTP %{http_code}\nFINAL %{url_effective}\n' "$URL" || true
          head -30 /tmp/h1 || true
          echo '=== followed request ==='
          curl -L -sS --max-time 20 -D /tmp/h2 -o /tmp/b2 -w 'HTTP %{http_code}\nFINAL %{url_effective}\n' "$URL" || true
          echo '--- markers ---'
          grep -Eio -m10 'Torre de Pizza|Torre Pizza|IN BRASA|cardápio|pizza|This page didn.t load' /tmp/b2 || true
          echo '--- title ---'
          grep -Eio -m1 '<title>[^<]+' /tmp/b2 || true
          echo '--- first bytes ---'
          head -c 1600 /tmp/b2 || true
          exit 0
