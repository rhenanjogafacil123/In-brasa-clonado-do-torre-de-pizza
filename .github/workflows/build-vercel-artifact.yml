name: Build Vercel Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for Vercel
        run: bun run build

      - name: Show Vercel output
        run: |
          echo "--- .vercel ---"
          find .vercel -maxdepth 4 -type f 2>/dev/null | head -200 || true
          echo "--- .output ---"
          find .output -maxdepth 4 -type f 2>/dev/null | head -200 || true

      - name: Upload Vercel output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output/
          if-no-files-found: error
          retention-days: 1
