name: ChatGPT Verify Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel public flags
        shell: bash
        run: |
          for URL in \
            'https://torre-public-flag-rhenanzinho09-4700.vercel.app' \
            'https://torre-protection-false-rhenanzinho09-4700.vercel.app' \
            'https://torre-unprotected-rhenanzinho09-4700.vercel.app'; do
            echo "===== $URL ====="
            curl -L -sS -o /tmp/page.html -w 'HTTP %{http_code}\nFINAL %{url_effective}\n' "$URL" || true
            grep -Eo 'PUBLIC_FLAG_OK|PROTECTION_FALSE_OK|UNPROTECTED_OK' /tmp/page.html || true
          done
