name: ChatGPT Verify Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production URL and site content
        shell: bash
        run: |
          URL='https://hello-friend-rhenanzinho09-4700.vercel.app'
          for i in {1..24}; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] && grep -qi 'Torre de Pizza' /tmp/page.html; then
              echo 'Production is online and Torre de Pizza content is present.'
              grep -o -i -m1 '.\{0,80\}Torre de Pizza.\{0,120\}' /tmp/page.html || true
              exit 0
            fi
            sleep 5
          done
          echo 'Production did not become healthy with expected content.'
          head -c 1500 /tmp/page.html || true
          exit 1
